[options]
; Paths inside the container
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Database connection (host/user/password come from the container environment)
db_port = 5432

; Change this master password before exposing Odoo anywhere.
; It protects the database manager (/web/database/manager).
admin_passwd = change-me-master-password

; Hide the database list from the login page in shared environments
list_db = True

; Workers: 0 = threaded dev mode. In production use (CPU cores * 2) + 1.
workers = 0
proxy_mode = False

; Logging
log_level = info
