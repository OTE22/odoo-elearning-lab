# Nginx reverse proxy in front of Odoo.
# Replace learn.example.org with your domain and put certificates in ops/nginx/certs/.

upstream odoo      { server odoo:8069; }
upstream odoochat  { server odoo:8072; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name learn.example.org;
  # Let's Encrypt HTTP challenge, then redirect everything to HTTPS
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name learn.example.org;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Course videos and PDFs can be large
  client_max_body_size 200m;
  proxy_read_timeout 720s;
  proxy_connect_timeout 720s;
  proxy_send_timeout 720s;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  # Real-time features (chat, notifications)
  location /websocket {
    proxy_pass http://odoochat;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_redirect off;
    proxy_pass http://odoo;
  }

  # Low-bandwidth friendly: compress text and cache static files
  gzip on;
  gzip_types text/css text/plain application/json application/javascript image/svg+xml;
  location ~* /web/static/ {
    proxy_cache_valid 200 60m;
    expires 7d;
    proxy_pass http://odoo;
  }
}
