name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint XML and Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every XML file parses
        run: |
          pip install lxml
          python - <<'EOF'
          import glob, lxml.etree as E
          files = glob.glob("addons/**/*.xml", recursive=True)
          for f in files:
              E.parse(f)
          print(f"{len(files)} XML files OK")
          EOF
      - name: Python syntax
        run: python -m compileall -q addons

  odoo-tests:
    name: Install modules and run tests on Odoo 17
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: odoo:17.0
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        run: |
          odoo --db_host=db --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE/addons \
            -d ci -i nova_course_proposal_writing,nova_course_digital_safety \
            --load-language=ar_001 --without-demo=all \
            --test-enable --test-tags=/nova_course_proposal_writing,/nova_course_digital_safety \
            --stop-after-init --log-level=test 2>&1 | tee odoo.log
          if grep -qE "(ERROR|CRITICAL) ci " odoo.log; then
            echo "::error::Odoo reported errors"; exit 1
          fi

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: odoo-elearning-lab:ci
