<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" lang="ar"><title>من الإفادة إلى الاختبار</title><rect width="800" height="400" rx="18" fill="#edf1f2"/><g direction="rtl" text-anchor="start" font-family="Tahoma,Arial,sans-serif" fill="#1b303b"><text x="748" y="57" font-size="32">من الإفادة إلى الاختبار</text><rect x="32" y="86" width="736" height="82" rx="12" fill="white"/><path d="M74 138v58" stroke="#753953" stroke-width="3"/><circle cx="74" cy="127" r="12" fill="#753953"/><text x="748" y="115" font-size="23" fill="#753953">الدليل</text><text x="748" y="149" font-size="29" font-weight="bold">ثمانية رواد يذكرون صعوبة العودة</text><rect x="32" y="180" width="736" height="82" rx="12" fill="white"/><path d="M74 232v58" stroke="#753953" stroke-width="3"/><circle cx="74" cy="221" r="12" fill="#753953"/><text x="748" y="209" font-size="23" fill="#753953">الفجوة</text><text x="748" y="243" font-size="29" font-weight="bold">لم تشمل المقابلات المنقطعين</text><rect x="32" y="274" width="736" height="82" rx="12" fill="white"/><circle cx="74" cy="315" r="12" fill="#753953"/><text x="748" y="303" font-size="23" fill="#753953">القرار</text><text x="748" y="337" font-size="29" font-weight="bold">اختبر موعدين قبل حجز القاعة</text></g></svg>